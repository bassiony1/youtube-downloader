name: Release

# Runs when a version tag is pushed (python release.py 1.2.3 does that): tests, builds the Setup, publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the tag with its message (checkout makes annotated tags lightweight)
        run: git fetch --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches pyproject.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "::error::tag ${{ github.ref_name }} but pyproject.toml says $version"; exit 1; }
      - name: Tests (offline)
        run: uv run --python 3.12 python test_ytd.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the Setup
        run: python build_installer.py
      - name: Publish
        run: gh release create "${{ github.ref_name }}" dist/YouTubeDownloader-Setup.exe --title "YouTube Downloader ${{ github.ref_name }}" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
